# MiNERVA-FM — all-in-one station.
# Indexes ./music, encodes to HLS, and serves the CRT web player on port 8080.
# Audio segments are AES-128 encrypted; the key rotates on every container start.
#
# Quick start:
#   docker compose up --build
#   open http://localhost:8080/
#
# Music layout: ./music/<System>/<Game>/<files>
#   e.g.  music/SNES/Chrono Trigger/01 Title.spc

services:
  station:
    build:
      context: .
      dockerfile: Dockerfile.station
    image: minerva-fm-station:latest
    container_name: minerva-fm-station
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./music:/music:ro   # your collection (read-only inside the container)
      - catalogue:/data     # generated catalogue (survives restarts)
    environment:
      BRIDGE_TOKEN:   "${BRIDGE_TOKEN:-changeme}"
      STREAM_BITRATE: "${STREAM_BITRATE:-128k}"
      # SID_DURATION: "180"   # seconds per SID track
      # MAX_TRACK:    "300"   # hard cap per track (seconds)
    restart: unless-stopped

volumes:
  catalogue:
