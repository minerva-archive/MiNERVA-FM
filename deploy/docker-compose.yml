services:
  station:
    image: gitea.lft.onl/admini/minerva-fm:latest
    container_name: minerva-fm-station
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./music:/music:ro   # your collection (read-only)
      - catalogue:/data     # generated catalogue (persists across restarts)
    environment:
      BRIDGE_TOKEN:   "${BRIDGE_TOKEN:?set BRIDGE_TOKEN in .env}"
      STREAM_BITRATE: "${STREAM_BITRATE:-128k}"
      # SID_DURATION: "180"   # seconds per SID track
      # MAX_TRACK:    "300"   # hard cap per track (seconds)
    restart: unless-stopped

volumes:
  catalogue:
