# MiNERVA-FM all-in-one station — nginx config.
# Serves the web player and HLS stream on port 8080.

# Rate-limiting zones (http context — this file is included inside nginx's http block)
limit_req_zone $binary_remote_addr zone=hls:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=key:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/m;

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    root /var/www/minerva-fm;
    index radio.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "no-referrer" always;
    # No X-Frame-Options so the page can be embedded cross-origin (main site iframe)
    # frame-ancestors is handled via CSP below.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; media-src 'self' blob:; worker-src blob:; frame-ancestors *;"
        always;

    location = / { try_files /radio.html =404; }

    # --- HLS playlist -------------------------------------------------------
    location = /hls/stream.m3u8 {
        alias /tmp/hls/stream.m3u8;
        add_header Content-Type  "application/vnd.apple.mpegurl" always;
        add_header Cache-Control "no-store"                      always;
        limit_req zone=hls burst=10 nodelay;
    }

    # --- HLS segments -------------------------------------------------------
    location ~ ^/hls/seg[0-9]+\.ts$ {
        root /tmp;
        add_header Cache-Control "max-age=30, immutable" always;
        limit_req zone=hls burst=20 nodelay;
    }

    # --- AES-128 decryption key ---------------------------------------------
    location = /hls-key {
        alias /tmp/hls.key;
        add_header Content-Type  "application/octet-stream" always;
        add_header Cache-Control "no-store"                 always;
        limit_req zone=key burst=5 nodelay;
    }

    # --- Now-playing snapshot (public, for bots and embeds) -----------------
    location = /api/now-playing {
        proxy_pass         http://127.0.0.1:8088/now-playing;
        add_header         Cache-Control "no-store" always;
        proxy_hide_header  Server;
        limit_req zone=api burst=10 nodelay;
    }

    # --- Admin: skip track (Bearer-token protected) -------------------------
    location = /admin/skip {
        proxy_pass        http://127.0.0.1:8088/admin/skip;
        proxy_set_header  Authorization $http_authorization;
        proxy_hide_header Server;
        limit_req zone=api burst=3 nodelay;
    }

    # --- Now-playing SSE ----------------------------------------------------
    location /events {
        proxy_pass         http://127.0.0.1:8088/events;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_read_timeout 1h;
        proxy_hide_header  Server;
    }

    # --- Metadata update (station → bridge, Bearer-token protected) ---------
    location /meta/update {
        proxy_pass        http://127.0.0.1:8088/update;
        proxy_set_header  Authorization $http_authorization;
        proxy_hide_header Server;
    }

    # Block everything else explicitly
    location / {
        try_files $uri =404;
    }
}
